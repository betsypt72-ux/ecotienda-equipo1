<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo · Vatio</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/tienda.js" defer></script>
</head>
<body class="container py-3">
    <header class="encabezado">
        <h1>Catálogo</h1>
        <p>Cada producto dice cuánto le ahorra al mes, con una tarifa de 960 COP/kWh.</p>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html" class="actual" aria-current="page">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>
    <main>
        <div class="filtros">
            <button class="filtro activo" data-categoria="todas">Todas</button>
            <button class="filtro" data-categoria="iluminacion">Iluminación</button>
            <button class="filtro" data-categoria="electrodomesticos">Electrodomésticos</button>
            <button class="filtro" data-categoria="solar">Energía solar</button>
        </div>
        <div class="buscador">
            <label for="buscar" class="visually-hidden">Buscar un producto</label>
            <input class="form-control" type="search" id="buscar" placeholder="Buscar un producto por nombre">
        </div>
        <div class="catalogo">
            <div id="productos" class="tarjetas"></div>
            <aside id="carrito">
                <h2>Carrito</h2>
                <ul id="lista-carrito"></ul>
                <p id="total"></p>
                <p id="ahorro"></p>
                <button id="vaciar" class="btn btn-outline-secondary btn-sm">Vaciar carrito</button>
            </aside>
        </div>
    </main>
    <footer class="pie">
        <p>Fuente de los precios: <a href="https://www.xm.com.co" target="_blank">XM</a> y
           <a href="https://www.cpc.ncep.noaa.gov" target="_blank">NOAA</a>. Los productos y sus precios son de ejemplo.</p>
        <p>Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
    </footer>
</body>
</html>
