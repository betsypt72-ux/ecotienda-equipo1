<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto · Vatio</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="container py-3">
    <header class="encabezado">
        <h1>Contacto</h1>
        <p>¿Dudas sobre qué equipo le conviene? Escríbanos.</p>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html" class="actual" aria-current="page">Contacto</a>
        </nav>
    </header>
    <main>
        <form action="contacto.html" method="get">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input class="form-control" type="text" id="nombre" name="nombre" required>
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input class="form-control" type="email" id="correo" name="correo" required>
            </div>
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input class="form-control" type="tel" id="telefono" name="telefono">
            </div>
            <div class="mb-3">
                <label for="motivo" class="form-label">Motivo</label>
                <select class="form-select" id="motivo" name="motivo">
                    <option value="compra">Quiero comprar</option>
                    <option value="consejo">Necesito una asesoría</option>
                    <option value="otro">Otro</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Enviar</button>
            <button class="btn btn-outline-secondary" type="reset">Borrar</button>
        </form>
    </main>
    <footer class="pie">
        <p>Fuente de los precios: <a href="https://www.xm.com.co" target="_blank">XM</a> y
           <a href="https://www.cpc.ncep.noaa.gov" target="_blank">NOAA</a>. Los productos y sus precios son de ejemplo.</p>
        <p>Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
    </footer>
</body>
</html>
